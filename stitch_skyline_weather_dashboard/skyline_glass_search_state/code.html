<script>
        // Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const layers = document.querySelectorAll('.bg-layer');
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            layers.forEach(layer => {
                layer.style.transform = `translate(${x}px, ${y}px)`;
            });
        });

        // Time-based Background System
        function updateBackground() {
            const hour = new Date().getHours();
            let activeId = '';

            if (hour >= 5 && hour < 11) {
                activeId = 'bg-morning';
            } else if (hour >= 11 && hour < 17) {
                activeId = 'bg-afternoon';
            } else if (hour >= 17 && hour < 20) {
                activeId = 'bg-evening';
            } else {
                activeId = 'bg-night';
            }

            document.querySelectorAll('.bg-layer').forEach(el => el.classList.remove('bg-active'));
            document.getElementById(activeId).classList.add('bg-active');
        }

        // Initialize and set interval
        updateBackground();
        setInterval(updateBackground, 60000); // Check every minute
    </script>
